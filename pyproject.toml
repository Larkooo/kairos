[project]
name = "kairos"
version = "0.1.0"
description = "Time-aware Gemma prototype with continuous-time embeddings, temporal attention decay, and multi-timescale memory"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
dependencies = [
    "accelerate>=1.13.0",
    "huggingface-hub>=1.10.1",
    "safetensors>=0.7.0",
    "torch>=2.11.0",
    "transformers>=5.5.3,<5.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kairos"]
